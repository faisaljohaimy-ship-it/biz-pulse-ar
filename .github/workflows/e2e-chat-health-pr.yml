name: SADEED chat health HTTP E2E on PR

# Additive, local-only HTTP check for health probe changes.
# Does not replace weekly/full E2E or connect to production/preview credentials.
on:
  pull_request:
    paths:
      - "src/lib/governance/health-probe-cache.ts"
      - "src/routes/api/chat.health.ts"
      - "tests/e2e/15-chat-health-readiness.spec.ts"
      - ".github/workflows/e2e-chat-health-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Chat health · concurrent HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build local SSR/client application
        run: npm run build
      - name: Start built app without production credentials
        run: |
          npx wrangler dev --config .output/server/wrangler.json --compatibility-date 2026-08-06 --port 4173 --local > /tmp/sadeed-health-e2e.log 2>&1 &
          echo $! > /tmp/sadeed-health-e2e.pid
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4173/ > /dev/null 2>&1; then
              echo "Local built app ready"; exit 0
            fi
            sleep 2
          done
          echo "Local built app failed"; tail -n 100 /tmp/sadeed-health-e2e.log
          exit 1
      - name: Verify concurrent health reads over actual HTTP
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/15-chat-health-readiness.spec.ts --project=desktop --project=mobile --workers=1
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: chat-health-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/sadeed-health-e2e.pid ]; then
            kill "$(cat /tmp/sadeed-health-e2e.pid)" 2>/dev/null || true
          fi
