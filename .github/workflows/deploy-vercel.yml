# Standing authorization: docs/operations/CONTINUOUS_DELIVERY_AR.md.
# main's native Vercel deploy remains disabled; this is the only release controller.
name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["CI Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "preview أو production؛ الإنتاج من main بعد نجاح CI فقط"
        required: true
        type: choice
        options: [preview, production]
        default: preview
      confirm:
        description: "اكتب deploy لنشر production"
        type: string
      expected_sha:
        description: "SHA كامل؛ يجب أن يطابق النسخة المشغّل منها الطلب"
        type: string
      owner_review_sha:
        description: "للتغييرات الحساسة: SHA الكامل الذي راجعه المالك"
        type: string
      owner_review_context:
        description: "للتغييرات الحساسة: رابط PR أو issue في هذا المستودع يسجل مراجعة المالك"
        type: string

concurrency:
  group: sadeed-vercel-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    # Never give a PR/fork workflow_run a secret-bearing runner.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (github.event_name == 'workflow_run' || inputs.target == 'production') && 'Production' || 'Preview' }}
    env:
      VERCEL_CLI_VERSION: "64.5.0"
      VERCEL_TELEMETRY_DISABLED: "1"
      NO_UPDATE_NOTIFIER: "1"
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Offline release guard regressions
        run: node --experimental-strip-types --test scripts/cd-gate.regression.test.mjs
      # No Vercel/GitHub credentials are exposed to this package installation.
      - name: Install exact reviewed CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Guard, stage, verify, promote and verify domains
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          SADEED_DEPLOY_CYCLE_BUDGET: ${{ vars.SADEED_DEPLOY_CYCLE_BUDGET }}
          SADEED_DEPLOY_CYCLE_STARTED_AT: ${{ vars.SADEED_DEPLOY_CYCLE_STARTED_AT }}
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import {
            RELEASE_REPOSITORY, RELEASE_PROJECT, RELEASE_TEAM, PRODUCTION_DOMAINS, RELEASE_ROUTES,
            assertReleaseCandidate, assertReleaseConfig, assertOwnerReview, assertSha,
            assertDeployment, assertAliases, assertLive, deploymentOrigin, probePublicLive,
            assertPageHtml, assertAsset, probePublicPages,
            deploymentCycle, assertDeploymentBudget, verifiedDeploymentCount,
          } from './scripts/cd-gate.mjs';

          const env = process.env;
          const event = JSON.parse(readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const sha = assertSha(env.RELEASE_SHA);
          const ref = env.RELEASE_REF;
          const summary = (line) => appendFileSync(env.GITHUB_STEP_SUMMARY, line + '\n');
          // Never log headers, tokens, raw upstream errors or response bodies.
          async function api(origin, path, token) {
            const response = await fetch(origin + path, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { authorization: `Bearer ${token}`, accept: 'application/json' },
            });
            if (!response.ok) throw new Error(`Release API GET failed: HTTP ${response.status}`);
            return response.json();
          }
          const github = (path) => api('https://api.github.com', `/repos/${RELEASE_REPOSITORY}${path}`, env.GH_TOKEN);
          const vercel = (path) => api('https://api.vercel.com', `${path}${path.includes('?') ? '&' : '?'}teamId=${RELEASE_TEAM}`, env.VERCEL_TOKEN);
          const currentMain = async () => (await github('/git/ref/heads/main')).object.sha;
          const aliases = async () => Promise.all(PRODUCTION_DOMAINS.map((domain) => vercel(`/v4/aliases/${domain}`)));
          const inspect = (id) => vercel(`/v13/deployments/${encodeURIComponent(id)}`);
          function cli(args, timeout = 900000) {
            // Vercel 64.5.0 reads VERCEL_TOKEN from env, never argv.
            const result = spawnSync('vercel', args, { encoding: 'utf8', timeout, maxBuffer: 8 * 1024 * 1024 });
            if (result.error || result.status !== 0) throw new Error('Vercel command failed; release stopped');
            return result.stdout.trim();
          }
          function stagePages(origin) {
            const checked = new Set();
            function get(path) {
              const response = cli(['curl', `${origin}${path}`, '--', '--silent', '--show-error', '--fail', '--max-time', '10', '--write-out', '\n%{http_code}\n%{content_type}']);
              const lines = response.split('\n');
              const contentType = lines.pop();
              const status = Number(lines.pop());
              return { status, contentType, body: lines.join('\n') };
            }
            for (const route of RELEASE_ROUTES) {
              const page = get(route);
              for (const path of assertPageHtml(page.status, page.contentType, page.body)) {
                if (checked.has(path)) continue;
                const asset = get(path);
                assertAsset(asset.status, asset.contentType, asset.body, path);
                checked.add(path);
              }
            }
          }
          async function gate() {
            const mainSha = await currentMain();
            const runs = await github(`/actions/workflows/ci.yml/runs?event=push&head_sha=${sha}&status=success&per_page=100`);
            return assertReleaseCandidate({ eventName: env.GITHUB_EVENT_NAME, event, sha, ref, mainSha, ciRuns: runs.workflow_runs });
          }

          let cycle, baseline, candidate, promoted = false, creationAttempted = false;
          try {
            const target = await gate();
            assertReleaseConfig(env); // Missing/mis-scoped credentials stop before any deployment.
            cycle = deploymentCycle(env, Date.now());
            const count = () => vercel(`/v6/deployments?projectId=${RELEASE_PROJECT}&since=${cycle.since}&limit=100`);
            const budget = assertDeploymentBudget(cycle, await count(), Date.now());
            summary(`Budget ${cycle.start}: total=${cycle.total}; spent=${budget.spent}; remaining=${budget.remaining}; reserve=2`);
            if (target === 'production') {
              const before = await aliases();
              baseline = await inspect(before[0]?.deploymentId);
              const baselineSha = assertSha(baseline.meta?.githubCommitSha);
              assertDeployment(baseline, baselineSha, 'production');
              assertAliases(before, baseline.id);
              await Promise.all(PRODUCTION_DOMAINS.map((domain) => probePublicLive(`https://${domain}`, baselineSha)));
              const diff = await github(`/compare/${baselineSha}...${sha}`);
              if (diff.status !== 'ahead' || diff.behind_by !== 0 || diff.merge_base_commit?.sha !== baselineSha || !Array.isArray(diff.files) || diff.files.length >= 300) {
                throw new Error('Release ancestry or complete change evidence is missing');
              }
              assertOwnerReview(env.GITHUB_EVENT_NAME, event, sha, diff.files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean)));
              summary(`Rollback baseline: ${baseline.id} / ${baselineSha}`);
            }
            const args = ['deploy', '--yes', '--build-env', `SADEED_BUILD_SHA=${sha}`, '--build-env', `SADEED_BUILD_REF=${ref}`, '--meta', `githubCommitSha=${sha}`, '--meta', `githubCommitRef=${ref}`];
            if (target === 'production') args.push('--prod', '--skip-domain');
            creationAttempted = true;
            const origin = deploymentOrigin(cli(args));
            candidate = await inspect(new URL(origin).hostname);
            assertDeployment(candidate, sha, target);
            const after = await count();
            const spent = verifiedDeploymentCount(cycle, after, Date.now());
            const remaining = cycle.total - spent;
            summary(`Deployment created: ${candidate.id}; remaining=${remaining}; reserve=2`);
            if (!after.deployments.some((deployment) => (deployment.uid ?? deployment.id) === candidate.id) || remaining < 2) throw new Error('Post-build budget evidence missing or emergency reserve consumed');
            // Authenticated CLI curl reads only liveness; no DB/rate-store probe or paid chat.
            const stamp = cli(['curl', `${origin}/api/public/live`, '--', '--silent', '--show-error', '--fail', '--max-time', '10']);
            assertLive(JSON.parse(stamp), sha, ref);
            stagePages(origin);
            summary(`Staged ${target}: ${origin} / ${candidate.id} / ${sha}`);
            if (target === 'preview') {
              summary('Preview verified; no production promotion.');
              process.exit(0);
            }
            assertAliases(await aliases(), baseline.id); // Stage must leave both live domains untouched.
            await gate(); // A newer main invalidates this candidate before traffic changes.
            promoted = true;
            const deadline = Date.now() + 90000;
            cli(['promote', origin, '--yes'], 90000);
            let verified = false;
            while (Date.now() < deadline) {
              try {
                assertAliases(await aliases(), candidate.id);
                await Promise.all(PRODUCTION_DOMAINS.map((domain) => probePublicLive(`https://${domain}`, sha, { timeoutMs: Math.max(1, Math.min(10000, deadline - Date.now())) })));
                await Promise.all(PRODUCTION_DOMAINS.map((domain) => probePublicPages(`https://${domain}`, { timeoutMs: Math.max(1, Math.min(10000, deadline - Date.now())) })));
                if (Date.now() > deadline) throw new Error('Production verification deadline exceeded');
                verified = true;
                break;
              } catch {
                if (Date.now() + 5000 >= deadline) break;
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }
            if (!verified) throw new Error('Production liveness/build verification failed within 90 seconds');
            summary(`Production verified: ${sha} on ${PRODUCTION_DOMAINS.join(', ')}`);
          } catch (error) {
            summary(`Release failed: ${error.message}`);
            if (creationAttempted && cycle) {
              try {
                const evidence = await vercel(`/v6/deployments?projectId=${RELEASE_PROJECT}&since=${cycle.since}&limit=100`);
                summary(`Budget after failed attempt: remaining=${cycle.total - verifiedDeploymentCount(cycle, evidence, Date.now())}; reserve=2`);
              } catch { summary('Budget after failed attempt: UNKNOWN; no retry authorized by this run'); }
            }
            if (promoted && baseline && candidate) {
              // Never roll back a staging failure or overwrite another release writer.
              try {
                const current = await aliases();
                if (current.some((alias) => ![baseline.id, candidate.id].includes(alias.deploymentId))) {
                  throw new Error('Concurrent production writer detected; no automatic rollback');
                }
                if (current.some((alias) => alias.deploymentId === candidate.id)) {
                  cli(['rollback', `https://${baseline.url}`, '--yes']);
                }
                assertAliases(await aliases(), baseline.id);
                await Promise.all(PRODUCTION_DOMAINS.map((domain) => probePublicLive(`https://${domain}`, baseline.meta.githubCommitSha)));
                // The previous release can legitimately predate the new decision-center route.
                await Promise.all(PRODUCTION_DOMAINS.map((domain) => probePublicPages(`https://${domain}`, { routes: ['/auth', '/sec/incidents'] })));
                summary(`Rollback verified: ${baseline.id} / ${baseline.meta.githubCommitSha}`);
              } catch {
                summary(`ROLLBACK UNVERIFIED: inspect production immediately; baseline ${baseline.id}`);
              }
            }
            process.exitCode = 1;
          }
          NODE
