name: CI Verification

# ── سياسة التشغيل (أمر المالك ٢٠٢٦/١٠/١٨) ─────────────────────────────────
# الفحص **الكامل** مرّةً في الأسبوع: الجمعة 18:00 بتوقيت الرياض = 15:00 UTC
# (لا توقيت صيفي في السعودية، فالإزاحة ثابتة +3 طوال السنة)، ويدويًّا متى طُلب
# (`workflow_dispatch`). وعلى الدفع إلى main وطلبات الدمج تجري **بوّابة ما قبل
# النشر الخفيفة** وحدها:
#   · static — التثبيت، الأنواع، lint، فحص الأسرار (فحص الشيفرة الميّتة الاستشاري
#     في الكامل وحده)؛
#   · test   — اختبارات الوحدة وتدقيق تبعيات الإنتاج؛
#   · build  — البناء وميزانية الأداء (أرضية التباين بمتصفّح Playwright في الكامل
#     وحده).
# و`rag-preflight` و`security-gap-closure-e2e` في التشغيل الكامل وحده.
#
# **CI فحصٌ فقط — لا نشر منه ولا يُشترط للنشر** (أمر المالك ٢٠٢٦/١٠/٢٣ «افصل الـCI عن
# الإنتاج والدمج والنشر»): كانت وظيفة `deploy` هنا تستدعي `deploy.yml` (نشر Cloudflare
# الاحتياطي) على كل دفعة إلى main بعد البوّابة الخفيفة. أُزيلت. النشر خطواتٌ صريحة
# بطلب: `deploy-vercel.yml` أو نشر Lovable، و`deploy.yml` يدويّ، وفحص الإنتاج
# (`production-check.yml`) مستقلّ بجدوله وتشغيله اليدويّ. والدمج لا يتوقّف على CI تقنيًّا
# (لا حماية فرع على خطة المستودع)؛ والبوّابة إجرائية تُقرَّر بقراءة نتيجته.
# شرط «الكامل» واحدٌ مكرّر حرفيًّا في كل موضع:
#   github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
on:
  push:
    branches: [main]
  pull_request:
  # البوّابة الإجرائية للإصدار (٢٠٢٦/١٠/١٧): حماية الفرع غير متاحة على خطّة
  # المستودع الحالية، فيُشغَّل الفحص يدويًّا على فرع الإصلاح قبل دمجه في main —
  # «CI أخضر على الـSHA المدفوع» شرطٌ يُقاس لا يُفترض. والتشغيل اليدوي كامل.
  workflow_dispatch:
  # الفحص الكامل الأسبوعي: الجمعة 15:00 UTC = 18:00 بتوقيت الرياض.
  schedule:
    - cron: "0 15 * * 5"

# ── لماذا وظائف متوازية لا وظيفة واحدة ────────────────────────────────────
# كانت `verify` وظيفةً واحدة تجمع التثبيت والفحص والبناء وفحوص Postgres،
# فتتجاوز خمس عشرة دقيقة على مُشغّل بنواتين. وهذا الحساب يقطع أي وظيفة عند
# ١٥:٠٠ بالضبط — قِيس على تشغيلين متتاليين: 15m02s و15m00s ثم «cancelled».
# والنتيجة أن `deploy` (‏`needs: verify`) كانت تُتخطّى في **كل** دفعة، فبقي
# الإنتاج مجمَّدًا على بناء ١٩ يوليو ثلاثة أسابيع كاملة.
#
# التقسيم يُبقي كل وظيفة بعيدة عن السقف، ويكشف الخطوة الساقطة بدل «سقطت
# verify»، ويقصّر زمن الحائط لأنها تجري معًا. و`timeout-minutes: 13` تجعل
# التعليق يفشل فشلًا صريحًا قبل القطع الخارجي الصامت.
jobs:
  static:
    name: static (types · lint · dead code)
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # فحص الأسرار كان في السلسلة المحلّية وحدها، فدفعات الكاتب الآلي تتجاوزه.
      - name: Secret scan
        run: npm run check:secrets
      - name: Dead-code scan (advisory)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:deadcode || true

  test:
    name: test (unit · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      # الأمر نفسه الذي تشغّله السلسلة المحلّية (`npm run check`) — لا نسخة ثانية.
      - name: Production dependency audit
        run: npm run check:audit

  build:
    name: build (bundle · budget)
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Enforce performance budget
        run: npm run check:performance
      # أرضية التباين فوق فيلم الخلفية — بمحرّكٍ حقيقيّ على الناتج المبنيّ.
      # قراءة الرموز نصًّا صرّحت بـ٤٫٩٠:١ والنافذ ٣٫٥٤:١؛ التعاقب يُسأل عنه
      # المتصفّح لا الملفّ. ويسقط على الهبوط وحده، لا على التحسّن.
      - name: Contrast floor over the background film (real engine)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npx playwright install --with-deps chromium
          npm run check:contrast
      - name: Smoke check bundle
        run: test -d dist || test -d .output

  rag-preflight:
    name: rag preflight (real Postgres)
    # التشغيل الكامل وحده (الأسبوعي أو اليدوي).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: RAG preflight (isolation + privilege on real Postgres)
        run: npm run check:rag

  # طبقة التكامل الحقيقية (tests/integration): Postgres 16 بسلسلة الترحيلات
  # كاملةً (الرولباك مستثنى، و13 فشلًا معلومًا تُطابَق بقائمةٍ مُلزِمة)، PostgREST
  # 12.2.3 بثنائي مثبَّت بـsha256، بوّابة HS256، وsupabase-js الحقيقية — والنموذج
  # وحده مُبرمَج. في التشغيل الكامل وحده كـrag-preflight. غياب ثنائيات Postgres
  # على المشغّل **فشلٌ لا تخطٍّ** (stack.sh يفرضه حين CI=true).
  integration:
    name: integration (real Postgres + PostgREST)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Cache PostgREST binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/sadeed-integration
          key: postgrest-v12.2.3-linux-static-x64
      - name: Bring up the stack (initdb → shim → migrations → fixtures → PostgREST → gateway)
        run: npm run integration:up
      - name: Typecheck the integration tier
        run: npm run typecheck:integration
      - name: Integration tests
        run: npm run test:integration
      - name: Tear down the stack
        if: always()
        run: npm run integration:down

  # Article 21 — security gate. The Article 19 E2E spec. Since the owner order
  # of 2026/10/18 it runs on the FULL suite only (weekly schedule +
  # workflow_dispatch), not on every push/PR — it never gated deploy anyway
  # (advisory when credentials are absent, and not in deploy's needs).
  security-gap-closure-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [static, test, build]
    # Bind to the production environment so this gate can read secrets whether
    # they were added as repository secrets OR under the `production`
    # environment (matching the deploy job). Without this, environment-scoped
    # secrets are invisible here and the credential guard fails.
    environment: production
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Check E2E credentials
        id: creds
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] \
             && [ -n "$E2E_TEST_EMAIL" ] && [ -n "$E2E_TEST_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "E2E credentials present — running the Article 19 security E2E."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E credentials are not configured — skipping the Article 19 security E2E. This gate is advisory and does NOT block deploy. Set VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, E2E_TEST_EMAIL and E2E_TEST_PASSWORD (Repository secrets) to enable it."
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.creds.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        if: steps.creds.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        if: steps.creds.outputs.configured == 'true'
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 --strictPort > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server up"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -n 200 /tmp/dev.log; exit 1
      - name: Run Article 19 E2E (advisory)
        id: art19
        if: steps.creds.outputs.configured == 'true'
        run: npx playwright test tests/e2e/11-security-gap-closure.spec.ts tests/e2e/05-command-center-auth.spec.ts --project=desktop
      - name: Upload Playwright report
        if: always() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-art19
          path: playwright-report
          if-no-files-found: ignore
      - name: Stop dev server
        if: always() && steps.creds.outputs.configured == 'true'
        run: if [ -f /tmp/dev.pid ]; then kill "$(cat /tmp/dev.pid)" || true; fi
