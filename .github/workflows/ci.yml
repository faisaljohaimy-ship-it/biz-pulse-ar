name: CI Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Enforce performance budget
        run: npm run check:performance
      - name: Smoke check bundle
        run: test -d dist || test -d .output

  # Article 21 — Continuous security gate. The Article 19 E2E spec is a
  # blocking check on every push/PR. If it fails, the merge is blocked and
  # an incident is opened against the deployed public sink so ARIA sees the
  # regression in the operational incident stream — not just in CI logs.
  security-gap-closure-e2e:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Check E2E credentials
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is required"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is required"; exit 1; }
          test -n "$E2E_TEST_EMAIL" || { echo "::error::E2E_TEST_EMAIL is required"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::E2E_TEST_PASSWORD is required"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 --strictPort > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server up"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -n 200 /tmp/dev.log; exit 1
      - name: Run Article 19 E2E (blocking)
        id: art19
        run: npx playwright test tests/e2e/11-security-gap-closure.spec.ts tests/e2e/05-command-center-auth.spec.ts --project=desktop
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-art19
          path: playwright-report
          if-no-files-found: ignore
      - name: Stop dev server
        if: always()
        run: if [ -f /tmp/dev.pid ]; then kill "$(cat /tmp/dev.pid)" || true; fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, security-gap-closure-e2e]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
