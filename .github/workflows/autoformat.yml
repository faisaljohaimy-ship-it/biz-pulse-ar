# Read-only formatting proposal. The reviewed main SHA is never advanced by a bot.
# Apply the downloaded patch on a feature branch and pass the normal review/CI gate.
name: Formatting proposal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatting-proposal
  cancel-in-progress: true

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format proposal
        run: npm run format
      - name: Export reviewed diff without changing Git history
        run: |
          git diff --binary > "$RUNNER_TEMP/sadeed-format.patch"
          git diff --stat > "$RUNNER_TEMP/sadeed-format-stat.txt"
          {
            echo "### Formatting proposal for $GITHUB_SHA"
            echo 'Download the patch artifact, review it, and apply it on a feature branch.'
            echo 'The regular pull request and CI checks are required before delivery.'
            cat "$RUNNER_TEMP/sadeed-format-stat.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload proposed patch
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sadeed-format-proposal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sadeed-format.patch
            ${{ runner.temp }}/sadeed-format-stat.txt
          if-no-files-found: error
          retention-days: 7
