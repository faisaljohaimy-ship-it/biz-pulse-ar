name: Weekly SSR E2E — PR validation (no secrets)

# An unprivileged check of changes to the scheduled weekly regression workflow.
# Never replaces the real scheduled weekly run, production security E2E, or CI.
# No production environment/secrets, deployments, or write permissions.
on:
  pull_request:
    paths:
      - ".github/workflows/weekly-regression.yml"
      - ".github/workflows/weekly-e2e-pr.yml"

permissions:
  contents: read

concurrency:
  group: weekly-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  e2e:
    name: All E2E specs — desktop Chromium + mobile WebKit (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      SADEED_EXPECT_UNCONFIGURED_HEALTH: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build local SSR app
        run: npm run build
      - name: Start and verify built SSR routes
        run: |
          npx wrangler dev --config .output/server/wrangler.json --compatibility-date 2026-08-06 --port 4173 --local > /tmp/sadeed-pr-ssr.log 2>&1 &
          echo $! > /tmp/sadeed-pr-ssr.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:4173/ > /dev/null; then
              blueprint_code=$(curl -sS --max-time 10 -o /tmp/sadeed-pr-blueprint.html -w '%{http_code}' http://127.0.0.1:4173/blueprint || true)
              if [ "$blueprint_code" != "200" ]; then
                echo "Blueprint route failed: HTTP ${blueprint_code}; SSR diagnostic follows"
                tail -n 100 /tmp/sadeed-pr-ssr.log
                exit 1
              fi
              # No DB/provider secrets in this PR-only job. Public health is
              # designed to return HTTP 503 when its fail-closed rate-limit
              # store cannot be reached; assert that precise JSON contract.
              public_code=$(curl -sS --max-time 10 -o /tmp/sadeed-public-health.json -w '%{http_code}' http://127.0.0.1:4173/api/public/health)
              PUBLIC_CODE="$public_code" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/sadeed-public-health.json", "utf8"));
                const code = process.env.PUBLIC_CODE;
                const expectedClosed = code === "503" &&
                  body.status === "down" &&
                  body.subsystems?.db?.status === "unknown" &&
                  body.subsystems?.db?.detail === "not_configured" &&
                  body.subsystems?.rate_limit_storage?.status === "down";
                const healthy = code === "200" && ["ok", "degraded"].includes(body.status);
                if (!expectedClosed && !healthy) {
                  console.error("Unexpected public-health status/contract:", code, body.status);
                  process.exit(1);
                }
              '
              curl -fsS --max-time 10 http://127.0.0.1:4173/api/chat/health -o /tmp/sadeed-chat-health.json
              node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/sadeed-chat-health.json", "utf8"));
                if (body.ok !== true || !["closed", "degraded", "verified"].includes(body.gate)) {
                  console.error("Unexpected chat-health JSON contract");
                  process.exit(1);
                }
              '
              echo "Built SSR app ready"
              exit 0
            fi
            sleep 2
          done
          echo "Built SSR app failed"
          tail -n 120 /tmp/sadeed-pr-ssr.log
          exit 1
      # Serial execution preserves every Chromium + WebKit assertion while
      # isolating the observed Wrangler SSR exit under simultaneous workers.
      # This does NOT suppress failures, change timeouts, or skip any spec.
      - name: Run every E2E spec on both projects
        run: npx playwright test --workers=1
      - name: Diagnose built SSR process on E2E failure (no gate bypass)
        if: failure()
        run: |
          if [ -f /tmp/sadeed-pr-ssr.pid ]; then
            pid="$(cat /tmp/sadeed-pr-ssr.pid)"
            if kill -0 "$pid" 2>/dev/null; then
              echo "SSR launcher alive:"
              ps -p "$pid" -o pid,ppid,stat,rss,etime,args || true
            else
              echo "SSR launcher exited before E2E completed: $pid"
            fi
          fi
          if [ -f /tmp/sadeed-pr-ssr.log ]; then
            echo "SSR diagnostic log tail:"
            tail -n 160 /tmp/sadeed-pr-ssr.log
          fi
          free -m || true
          # Wrangler writes crash diagnostics to its own per-run log, not
          # always to the redirected stdout stream. Surface the newest log
          # without changing test execution, workers, assertions, or gates.
          # This pull-request workflow receives no production credentials.
          echo "Latest Wrangler crash diagnostics:"
          if [ -d "$HOME/.config/.wrangler/logs" ]; then
            find "$HOME/.config/.wrangler/logs" -maxdepth 1 -type f -name 'wrangler-*.log' -mmin -30 -print -exec tail -n 120 {} \;
          else
            echo "No Wrangler diagnostic directory"
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: weekly-pr-e2e-report
          path: |
            playwright-report/
            test-results/
            /tmp/sadeed-pr-ssr.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop built app
        if: always()
        run: |
          if [ -f /tmp/sadeed-pr-ssr.pid ]; then
            kill "$(cat /tmp/sadeed-pr-ssr.pid)" 2>/dev/null || true
          fi
