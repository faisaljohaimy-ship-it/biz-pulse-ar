# فحص أمني ذاتيّ مأذون — Strix على مستودع المالك نفسه.
#
# الاستعمال المأذون حصرًا: تقييم أمني دفاعيّ لتطبيق ومستودع صاحب هذا المشروع ضمن
# تحصين ما قبل الإصدار. ليس أداةً ضدّ أنظمة الغير.
#
# ── لماذا بالطلب فقط وغير حاجب ──
# كلّ تشغيل ينفق نداءات نموذج ويحتاج صندوق Docker، فلا يُشغَّل تلقائيًّا. ونتائجه
# **مدخلات مراجعة** لا بوابة قبول: لا تُرسِب PR ولا تُصلح تلقائيًّا؛ أيّ إصلاح يمرّ
# بوابة `nexios-qa-guardian` والمراجعة البشرية (المادة ٨). لا يلمس قاعدة الإنتاج
# ولا أسراره ولا DNS.
#
# ── المتطلّبات (Settings → Secrets and variables → Actions) ──
#   Secret STRIX_LLM           — اسم النموذج (مثل "openai/gpt-5.4" أو مزوّد مدعوم)
#   Secret STRIX_LLM_API_KEY   — مفتاح مزوّد النموذج
# غيابهما يجعل الوظيفة تقف بوضوح («طُلب فحص ولم يُهيّأ») لا تخطّيًا صامتًا.
name: Security self-scan (Strix)

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "نطاق الفحص"
        required: false
        type: choice
        options:
          - quick
          - deep
        default: quick

concurrency:
  group: security-scan-strix
  cancel-in-progress: false

jobs:
  strix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check credentials
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          STRIX_LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
        run: |
          missing=0
          [ -n "$STRIX_LLM" ] && echo "  ✓ STRIX_LLM = set" || { echo "  ✗ STRIX_LLM = EMPTY"; missing=1; }
          [ -n "$STRIX_LLM_API_KEY" ] && echo "  ✓ STRIX_LLM_API_KEY = set" || { echo "  ✗ STRIX_LLM_API_KEY = EMPTY"; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "::error::طُلب فحص Strix ولم تُضبط أسراره — أضف STRIX_LLM وSTRIX_LLM_API_KEY ثم أعد التشغيل."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Strix
        run: |
          python -m pip install --upgrade pipx
          pipx install strix-agent
          pipx ensurepath || true

      # غير حاجب: النتائج تقرير/أثر للمراجعة، لا رسوب الوظيفة.
      - name: Run authorized self-scan
        id: scan
        continue-on-error: true
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
          MODE: ${{ inputs.scan_mode }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p strix-report
          # فحص ذاتيّ غير تفاعليّ لشجرة المستودع المحلّية (أصل المالك).
          strix -n -t ./ --scan-mode "${MODE:-quick}" 2>&1 | tee strix-report/scan.log || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: strix-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### فحص Strix الذاتيّ — ${{ inputs.scan_mode }}"
            echo ""
            echo "دفاعيّ على أصل المالك، غير حاجب. النتائج في الأثر \`strix-report\`."
            echo "أيّ إصلاح يمرّ بوابة \`nexios-qa-guardian\` والمراجعة البشرية — لا دمج تلقائيّ."
          } >> "$GITHUB_STEP_SUMMARY"
