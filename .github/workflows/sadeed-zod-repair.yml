name: SADEED isolated release verification
on:
  push:
    branches: [repair/sadeed-zod-security-20261024]
    paths: [.github/workflows/sadeed-zod-repair.yml]
permissions:
  contents: read
concurrency:
  group: sadeed-isolated-zod-repair
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'faisaljohaimy-ship-it/biz-pulse-ar'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f189e4caa09b622c373bca76b546947b409f373d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline model-error and backend health regression tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f189e4caa09b622c373bca76b546947b409f373d
          node --test scripts/smoke-production.regression.test.mjs
          echo "OFFLINE_REGRESSION_SHA=$(git rev-parse HEAD)"
