# Deploy pipeline — replaces Lovable's auto-deploy.
#
#   Claude Code → git push → GitHub → GitHub Actions (this file)
#                → build (Vite/nitro, Cloudflare Workers target)
#                → wrangler deploy → Cloudflare Workers → neexios.com
#
# The app is a TanStack Start + nitro SSR app whose build already targets
# Cloudflare Workers (see .output/server/wrangler.json). This workflow builds
# it and deploys the generated Worker.
#
# ── REQUIRED GitHub repository secrets (Settings → Secrets → Actions) ──
#   CLOUDFLARE_API_TOKEN   — Cloudflare token with "Edit Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# All deployment and public Supabase values are required. A missing value fails
# the production job clearly instead of reporting a skipped deployment as green.
#
# ── RUNTIME secrets (set as Cloudflare Worker variables, NOT here) ──
# Server env like SUPABASE_SERVICE_ROLE_KEY, ELEVENLABS_API_KEY, DATABASE_URL,
# STRIPE_SECRET_KEY, OPENROUTER_API_KEY, LOVABLE_API_KEY, HEYGEN_*, MICROSOFT_*,
# POWERBI_* … are configured on the Cloudflare Worker (dashboard → Settings →
# Variables, or `wrangler secret put`). They are never committed to the repo.
# Public build-time vars (VITE_SUPABASE_*) come from GitHub Actions secrets.

name: Deploy to Cloudflare

on:
  workflow_call:

# Only one deploy at a time; newer pushes cancel superseded runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Diagnostic: print presence (length only — values stay masked) of each
          # secret as resolved in THIS repo's Actions context, so a missing secret
          # is pinpointed instead of failing on the first one.
          echo "Deploy secret presence in this repo's Actions context:"
          missing=0
          check() { if [ -n "$2" ]; then echo "  ✓ $1 = set (len ${#2})"; else echo "  ✗ $1 = EMPTY"; missing=1; fi; }
          check CLOUDFLARE_API_TOKEN "$CF_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT"
          check VITE_SUPABASE_URL "$VITE_SUPABASE_URL"
          check VITE_SUPABASE_PUBLISHABLE_KEY "$VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ "$missing" = "1" ]; then
            echo "::error::One or more deploy secrets resolve EMPTY on this repo. If you added them under Repository secrets on THIS exact repo, the cause is an Actions/org secret-access restriction — check Settings → Actions → General (workflow permissions) and, for org repos, the org's secret-access policy."
            exit 1
          fi
          echo "All deploy secrets present — proceeding."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (Cloudflare Workers target)
        run: npm run build

      - name: Enforce performance budget
        run: npm run check:performance

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The build emits the Worker + its wrangler.json here.
          workingDirectory: .output/server
          command: deploy
