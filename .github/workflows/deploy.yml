# Deploy pipeline — OPTIONAL backup path (primary deploy is Lovable's pipeline).
#
#   Claude Code → git push → GitHub → GitHub Actions (this file)
#                → build (Vite/nitro, Cloudflare Workers target)
#                → wrangler deploy → Cloudflare Workers → neexios.com
#
# The app is a TanStack Start + nitro SSR app whose build already targets
# Cloudflare Workers (see .output/server/wrangler.json). This workflow builds
# it and deploys the generated Worker.
#
# ── Deployment model (Constitution Article X) ──
# Primary deployment runs through Lovable's own pipeline. This GitHub Actions
# deploy is a SECONDARY, independent backup that activates only when its secrets
# are present; when they are absent it SKIPS quietly and the job stays GREEN
# (non-blocking) — CI never goes red over deploy secrets.
#
# ── Secrets to ACTIVATE this backup deploy (Settings → Secrets → Actions) ──
#   CLOUDFLARE_API_TOKEN   — Cloudflare token with "Edit Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY — public build-time vars
#
# ── RUNTIME secrets (set as Cloudflare Worker variables, NOT here) ──
# Server env like SUPABASE_SERVICE_ROLE_KEY, ELEVENLABS_API_KEY, DATABASE_URL,
# STRIPE_SECRET_KEY, OPENROUTER_API_KEY, LOVABLE_API_KEY, HEYGEN_*, MICROSOFT_*,
# POWERBI_* … are configured on the Cloudflare Worker (dashboard → Settings →
# Variables, or `wrangler secret put`). They are never committed to the repo.
# Public build-time vars (VITE_SUPABASE_*) come from GitHub Actions secrets.

name: Deploy to Cloudflare

on:
  workflow_call:

# Only one deploy at a time; newer pushes cancel superseded runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Non-blocking guard (Constitution Article X). Primary deployment runs
          # through Lovable's own pipeline, so this GitHub Actions deploy is an
          # OPTIONAL secondary path. When its secrets are absent it SKIPS quietly
          # (job stays green) instead of failing red. Add the four secrets as
          # Repository secrets to activate this independent backup deploy.
          echo "Deploy secret presence in this repo's Actions context:"
          missing=0
          check() { if [ -n "$2" ]; then echo "  ✓ $1 = set (len ${#2})"; else echo "  ✗ $1 = EMPTY"; missing=1; fi; }
          check CLOUDFLARE_API_TOKEN "$CF_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT"
          check VITE_SUPABASE_URL "$VITE_SUPABASE_URL"
          check VITE_SUPABASE_PUBLISHABLE_KEY "$VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ "$missing" = "1" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Actions deploy secrets are absent — skipping the backup Cloudflare deploy (non-blocking). Deployment is handled by Lovable's pipeline. To enable this independent backup path, add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY as Repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All deploy secrets present — proceeding with the backup Cloudflare deploy."
          fi

      - name: Setup Node
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build (Cloudflare Workers target)
        if: steps.creds.outputs.configured == 'true'
        run: npm run build

      - name: Enforce performance budget
        if: steps.creds.outputs.configured == 'true'
        run: npm run check:performance

      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The build emits the Worker + its wrangler.json here.
          workingDirectory: .output/server
          command: deploy
