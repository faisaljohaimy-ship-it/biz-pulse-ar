name: Engineering offline integrity
on:
  pull_request:
    paths: [".engineering/**", ".agents/skills/**", ".claude/skills/**", ".github/workflows/engineering-offline.yml"]
  push:
    branches: [main]
    paths: [".engineering/**", ".agents/skills/**", ".claude/skills/**", ".github/workflows/engineering-offline.yml"]
permissions:
  contents: read
concurrency:
  group: engineering-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify vendored capabilities without reaching the public hub
        run: python3 .engineering/sdk/engineering_sdk.py verify
