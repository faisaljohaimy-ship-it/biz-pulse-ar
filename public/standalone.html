<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-locale="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus AI OS — مركز القيادة المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   NEXUS AI OS — single-file command center
   Theme: Saudi Energy (deep navy + emerald). Dark default, RTL/AR.
   Self-contained: no external scripts. Works offline in Safari.
   ============================================================ */
:root{
  --radius:1rem;
  --bg:oklch(0.16 0.04 240);
  --fg:oklch(0.98 0.005 240);
  --card:oklch(0.21 0.05 240);
  --popover:oklch(0.20 0.05 240);
  --primary:oklch(0.62 0.17 235);
  --primary-glow:oklch(0.72 0.16 230);
  --secondary:oklch(0.26 0.05 240);
  --muted:oklch(0.24 0.04 240);
  --muted-fg:oklch(0.72 0.03 235);
  --accent:oklch(0.68 0.16 160);
  --destructive:oklch(0.65 0.22 25);
  --success:oklch(0.72 0.17 160);
  --warning:oklch(0.82 0.15 85);
  --border:oklch(0.32 0.04 240 / 50%);
  --sidebar:oklch(0.13 0.04 240);
  --c1:oklch(0.62 0.17 235);--c2:oklch(0.72 0.17 160);--c3:oklch(0.78 0.12 200);--c4:oklch(0.82 0.15 85);--c5:oklch(0.70 0.18 320);
  --grad-primary:linear-gradient(135deg,oklch(0.62 0.17 235),oklch(0.72 0.16 200));
  --grad-emerald:linear-gradient(135deg,oklch(0.72 0.17 160),oklch(0.62 0.17 200));
  --grad-hero:linear-gradient(135deg,oklch(0.62 0.17 235) 0%,oklch(0.55 0.15 215) 45%,oklch(0.70 0.17 160) 100%);
  --shadow-glow:0 20px 60px -20px oklch(0.62 0.17 235 / 45%);
  --shadow-elev:0 10px 40px -15px oklch(0.08 0.02 240 / 70%);
  --font-sans:"Space Grotesk","DM Sans",system-ui,sans-serif;
  --font-ar:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:oklch(0.985 0.005 240);--fg:oklch(0.18 0.04 240);--card:oklch(1 0 0);--popover:oklch(1 0 0);
  --primary:oklch(0.52 0.17 235);--secondary:oklch(0.95 0.01 240);--muted:oklch(0.95 0.01 240);
  --muted-fg:oklch(0.45 0.03 240);--accent:oklch(0.55 0.16 160);--border:oklch(0.88 0.02 240 / 80%);
  --sidebar:oklch(0.98 0.005 240);--shadow-elev:0 10px 40px -18px oklch(0.55 0.06 240 / 30%);
}
*{box-sizing:border-box;border-color:var(--border);margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-ar);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
[data-locale="en"] body, [data-locale="en"]{direction:ltr;font-family:var(--font-sans)}
.atmos{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.atmos .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.22}
.atmos .b1{top:-160px;inset-inline-start:-10%;width:480px;height:480px;background:var(--primary)}
.atmos .b2{bottom:-160px;inset-inline-end:-10%;width:420px;height:420px;background:var(--accent)}
[data-theme="light"] body{background-image:radial-gradient(ellipse 60% 50% at 8% 0%,oklch(0.52 0.17 235/.10),transparent 60%),radial-gradient(ellipse 50% 40% at 100% 100%,oklch(0.55 0.16 160/.10),transparent 60%)}

.app{display:flex;height:100vh}
/* ---------------- Sidebar ---------------- */
.sidebar{
  width:268px;flex-shrink:0;height:100vh;display:flex;flex-direction:column;
  background:color-mix(in oklch,var(--sidebar) 88%,transparent);
  backdrop-filter:blur(20px);
  border-inline-end:1px solid var(--border);
  overflow-y:auto;scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:var(--grad-hero);display:grid;place-items:center;box-shadow:var(--shadow-glow);position:relative}
.brand .logo svg{width:22px;height:22px}
.brand .logo::after{content:"";position:absolute;inset:0;border-radius:11px;border:1px solid oklch(0.72 0.16 230/.5);animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.6;transform:scale(1.06)}}
.brand .name{font-family:var(--font-sans);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .sub{font-size:10px;color:var(--muted-fg);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.navgroup{padding:6px 12px}
.navgroup>.glabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg);padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;cursor:pointer;color:oklch(0.88 0.02 240);font-size:13.5px;font-weight:500;transition:.18s;position:relative}
[data-theme="light"] .navitem{color:oklch(0.30 0.04 240)}
.navitem:hover{background:color-mix(in oklch,var(--primary) 10%,transparent);color:var(--fg)}
.navitem.active{background:var(--grad-primary);color:#fff;box-shadow:0 6px 22px -10px var(--primary)}
.navitem svg{width:17px;height:17px;flex-shrink:0}
.navitem .badge{margin-inline-start:auto;font-size:10px;background:var(--accent);color:#04221a;border-radius:8px;padding:1px 7px;font-weight:700}

/* ---------------- Main ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.topbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--card) 55%,transparent);backdrop-filter:blur(20px)}
.menu-btn{display:none;background:none;border:none;color:var(--fg);cursor:pointer}
.pagetitle{font-family:var(--font-sans);font-weight:700;font-size:18px;letter-spacing:-.02em}
[data-locale="ar"] .pagetitle{font-family:var(--font-ar)}
.pillrow{display:flex;align-items:center;gap:8px;margin-inline-start:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in oklch,var(--success) 16%,transparent);color:var(--success);border:1px solid color-mix(in oklch,var(--success) 35%,transparent)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 var(--success);animation:livedot 1.8s infinite}
@keyframes livedot{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--success) 70%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--border);background:color-mix(in oklch,var(--card) 60%,transparent);color:var(--fg);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;transition:.18s}
.tb-btn:hover{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 12%,transparent)}
.tb-btn svg{width:16px;height:16px}
.tb-btn.aria{background:var(--grad-emerald);border:none;color:#04221a}
.clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted-fg);font-weight:600}

.scroll{flex:1;overflow-y:auto;padding:26px 28px 60px}
.scroll::-webkit-scrollbar{width:9px}.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

/* page header strip */
.whystrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.whycard{background:color-mix(in oklch,var(--card) 70%,transparent);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.whycard .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:5px}
.whycard .v{font-size:13.5px;font-weight:600;line-height:1.5}
.whycard.next .v{color:var(--accent)}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{position:relative;background:linear-gradient(160deg,color-mix(in oklch,var(--card) 92%,transparent),color-mix(in oklch,var(--bg) 70%,transparent));border:1px solid var(--border);border-radius:16px;padding:18px;overflow:hidden;transition:.25s}
.kpi:hover{transform:translateY(-3px);border-color:color-mix(in oklch,var(--primary) 50%,transparent);box-shadow:var(--shadow-elev)}
.kpi .top{display:flex;align-items:center;justify-content:space-between}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in oklch,var(--primary) 16%,transparent);color:var(--primary-glow)}
.kpi .ic svg{width:18px;height:18px}
.kpi .delta{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.kpi .delta.up{color:var(--success);background:color-mix(in oklch,var(--success) 14%,transparent)}
.kpi .delta.down{color:var(--destructive);background:color-mix(in oklch,var(--destructive) 14%,transparent)}
.kpi .val{font-family:var(--font-sans);font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:14px;font-variant-numeric:tabular-nums}
.kpi .lab{font-size:12.5px;color:var(--muted-fg);font-weight:500;margin-top:3px}
.kpi .spark{position:absolute;inset-inline-end:0;bottom:0;width:60%;height:42px;opacity:.5}

/* panels */
.row{display:grid;gap:16px;margin-bottom:18px}
.row.r2{grid-template-columns:1.6fr 1fr}
.row.r3{grid-template-columns:repeat(3,1fr)}
.panel{background:color-mix(in oklch,var(--card) 80%,transparent);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(10px)}
.panel h3{font-family:var(--font-sans);font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;margin-bottom:4px}
[data-locale="ar"] .panel h3{font-family:var(--font-ar)}
.panel h3 svg{width:17px;height:17px;color:var(--primary-glow)}
.panel .desc{font-size:11.5px;color:var(--muted-fg);margin-bottom:14px}
canvas{display:block;width:100%}

/* feed list */
.feed{display:flex;flex-direction:column;gap:10px}
.feeditem{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:12px;background:color-mix(in oklch,var(--bg) 45%,transparent);border:1px solid var(--border)}
.feeditem .tag{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.feeditem .t{font-size:12.5px;font-weight:600;line-height:1.5}
.feeditem .m{font-size:11px;color:var(--muted-fg);margin-top:2px}
.feeditem .time{margin-inline-start:auto;font-size:10px;color:var(--muted-fg);white-space:nowrap}

/* agent swarm */
.agents{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.agent{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:color-mix(in oklch,var(--bg) 45%,transparent);border:1px solid var(--border)}
.agent .av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;font-family:var(--font-sans)}
.agent .nm{font-size:12.5px;font-weight:600}
.agent .st{font-size:10px;color:var(--muted-fg);display:flex;align-items:center;gap:4px}
.agent .st .d{width:6px;height:6px;border-radius:50%;background:var(--success)}
.agent.idle .st .d{background:var(--muted-fg)}
.agent.busy .st .d{background:var(--warning);animation:livedot 1.6s infinite}

/* progress bars */
.prog{margin:9px 0}
.prog .pl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog .pl span:last-child{color:var(--muted-fg);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;border-radius:5px;background:color-mix(in oklch,var(--bg) 60%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--grad-primary);transition:width 1.2s cubic-bezier(.22,1,.36,1)}

/* generic page placeholder */
.modpanel{text-align:center;padding:50px 20px}
.modpanel .big{width:64px;height:64px;border-radius:18px;background:var(--grad-primary);display:grid;place-items:center;margin:0 auto 18px;box-shadow:var(--shadow-glow)}
.modpanel .big svg{width:30px;height:30px;color:#fff}
.modpanel h2{font-family:var(--font-sans);font-size:20px;font-weight:700;margin-bottom:8px}
[data-locale="ar"] .modpanel h2{font-family:var(--font-ar)}
.modpanel p{color:var(--muted-fg);font-size:13.5px;max-width:520px;margin:0 auto 22px;line-height:1.7}
.modfeatures{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:760px;margin:0 auto}
.modfeatures .mf{background:color-mix(in oklch,var(--card) 70%,transparent);border:1px solid var(--border);border-radius:13px;padding:16px;text-align:start}
.modfeatures .mf b{display:block;font-size:13px;margin-bottom:5px}
.modfeatures .mf small{color:var(--muted-fg);font-size:11.5px;line-height:1.6}

/* ARIA copilot drawer */
.aria-drawer{position:fixed;inset-block:0;inset-inline-end:0;width:400px;max-width:92vw;background:color-mix(in oklch,var(--card) 96%,transparent);backdrop-filter:blur(24px);border-inline-start:1px solid var(--border);box-shadow:-30px 0 80px -30px oklch(0.05 0.02 240/.7);transform:translateX(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:60;display:flex;flex-direction:column}
[data-locale="en"] .aria-drawer{transform:translateX(-100%)}
.aria-drawer.open{transform:translateX(0)!important}
.aria-head{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.aria-head .av{width:38px;height:38px;border-radius:11px;background:var(--grad-emerald);display:grid;place-items:center;box-shadow:var(--shadow-glow)}
.aria-head .av svg{width:20px;height:20px;color:#04221a}
.aria-head .nm{font-family:var(--font-sans);font-weight:700;font-size:15px}
.aria-head .role{font-size:10.5px;color:var(--muted-fg)}
.aria-head .x{margin-inline-start:auto;background:none;border:none;color:var(--muted-fg);cursor:pointer;font-size:20px}
.aria-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.65}
.msg.bot{background:color-mix(in oklch,var(--bg) 50%,transparent);border:1px solid var(--border);align-self:flex-start;border-start-start-radius:4px}
.msg.user{background:var(--grad-primary);color:#fff;align-self:flex-end;border-start-end-radius:4px}
.msg.bot b{color:var(--accent)}
.suggest{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 12px}
.suggest button{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:color-mix(in oklch,var(--card) 60%,transparent);color:var(--fg);cursor:pointer;font-family:inherit}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.aria-input{display:flex;gap:9px;padding:14px 16px;border-top:1px solid var(--border)}
.aria-input input{flex:1;background:color-mix(in oklch,var(--bg) 55%,transparent);border:1px solid var(--border);border-radius:11px;padding:11px 13px;color:var(--fg);font-family:inherit;font-size:13px;outline:none}
.aria-input input:focus{border-color:var(--accent)}
.aria-input button{width:42px;border-radius:11px;border:none;background:var(--grad-emerald);color:#04221a;cursor:pointer;display:grid;place-items:center}
.aria-input button svg{width:18px;height:18px}
.scrim{position:fixed;inset:0;background:oklch(0.08 0.02 240/.55);backdrop-filter:blur(2px);z-index:55;opacity:0;visibility:hidden;transition:.3s}
.scrim.show{opacity:1;visibility:visible}

/* command palette */
.cmdk{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:oklch(0.08 0.02 240/.55);backdrop-filter:blur(4px)}
.cmdk.show{display:flex}
.cmdk-box{width:560px;max-width:92vw;background:color-mix(in oklch,var(--popover) 98%,transparent);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-elev);overflow:hidden}
.cmdk-box input{width:100%;padding:16px 18px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--fg);font-family:inherit;font-size:15px;outline:none}
.cmdk-list{max-height:340px;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
.cmdk-item svg{width:16px;height:16px;color:var(--muted-fg)}
.cmdk-item.sel,.cmdk-item:hover{background:color-mix(in oklch,var(--primary) 14%,transparent)}
.cmdk-item .grp{margin-inline-start:auto;font-size:10px;color:var(--muted-fg)}

@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,1fr)}.row.r2,.row.r3{grid-template-columns:1fr}.whystrip{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:70;transform:translateX(-100%);transition:.3s}
  [data-locale="ar"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)!important}
  .menu-btn{display:inline-flex}
  .modfeatures{grid-template-columns:1fr}
  .clock{display:none}
}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="atmos"><div class="blob b1"></div><div class="blob b2"></div></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      </div>
      <div>
        <div class="name">Nexus<span style="color:var(--accent)"> AI</span> OS</div>
        <div class="sub" id="brandSub">حضارة تشغيلية ذكية</div>
      </div>
    </div>
    <nav id="nav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="pagetitle" id="pageTitle">لوحة القيادة</div>
      <div class="pillrow"><span class="pill"><span class="dot"></span><span id="livePill">مباشر</span></span></div>
      <div class="spacer"></div>
      <span class="clock" id="clock"></span>
      <button class="tb-btn" id="cmdBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span id="cmdLabel">بحث ⌘K</span></button>
      <button class="tb-btn" id="langBtn">EN</button>
      <button class="tb-btn" id="themeBtn"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></button>
      <button class="tb-btn aria" id="ariaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2"/><circle cx="12" cy="12" r="4"/></svg><span id="ariaLabel">آريا</span></button>
    </header>
    <div class="scroll" id="view"></div>
  </div>
</div>

<!-- ARIA copilot -->
<div class="scrim" id="scrim"></div>
<aside class="aria-drawer" id="ariaDrawer">
  <div class="aria-head">
    <div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2"/><circle cx="12" cy="12" r="4"/></svg></div>
    <div><div class="nm">ARIA</div><div class="role" id="ariaRole">مساعد القيادة التنفيذي</div></div>
    <button class="x" id="ariaClose">×</button>
  </div>
  <div class="aria-body" id="ariaBody"></div>
  <div class="suggest" id="ariaSuggest"></div>
  <div class="aria-input">
    <input id="ariaInput" placeholder="اسأل آريا..." />
    <button id="ariaSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </div>

/* =================== canvas charts (no libs) =================== */
function oklchToCss(v){return v;}
function lineChart(c,data,color,fill){
  const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight||150;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const mn=Math.min(...data),mx=Math.max(...data),pad=10;
  const px=i=>pad+i*(w-pad*2)/(data.length-1);
  const py=v=>h-pad-((v-mn)/((mx-mn)||1))*(h-pad*2);
  x.beginPath();data.forEach((v,i)=>{i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v));});
  x.lineWidth=2.5;x.strokeStyle=color;x.lineJoin="round";x.stroke();
  if(fill){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,color.replace(")","/0.28)").replace("oklch(","oklch("));g.addColorStop(1,"transparent");
    x.lineTo(px(data.length-1),h-pad);x.lineTo(px(0),h-pad);x.closePath();x.fillStyle=g;x.fill();}
}
function barChart(c,data,color){
  const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight||150;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const mx=Math.max(...data),pad=8,bw=(w-pad*2)/data.length*0.62,gap=(w-pad*2)/data.length;
  data.forEach((v,i)=>{const bh=(v/mx)*(h-pad*2),bx=pad+i*gap+(gap-bw)/2,by=h-pad-bh;
    const g=x.createLinearGradient(0,by,0,h);g.addColorStop(0,color);g.addColorStop(1,color.replace(")","/0.35)"));
    x.fillStyle=g;x.beginPath();x.roundRect(bx,by,bw,bh,4);x.fill();});
}
function donut(c,pct,color){
  const dpr=window.devicePixelRatio||1,s=c.clientWidth;c.width=s*dpr;c.height=s*dpr;
  const x=c.getContext("2d");x.scale(dpr,dpr);const r=s/2-8,cx=s/2,cy=s/2;
  x.lineWidth=10;x.strokeStyle="oklch(0.30 0.04 240)";x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
  x.strokeStyle=color;x.lineCap="round";x.beginPath();x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);x.stroke();
  x.fillStyle="var(--fg)";
}

  cockpit:[["لوحات تنفيذية","Executive dashboards","رؤية لحظية موحدة لكل مؤشرات المؤسسة","Unified live view of every enterprise KPI"],["مراقبة العمليات","Live ops monitoring","تتبّع الأنظمة والوكلاء والتدفقات لحظيًا","Track systems, agents and flows in real time"],["مساعد آريا","ARIA copilot","قرارات مدعومة بالذكاء داخل قمرة القيادة","AI-assisted decisions inside the cockpit"]],
  agents:[["تنسيق السرب","Swarm coordination","10 وكلاء متخصصين يتعاونون باستقلالية","10 specialized agents collaborating autonomously"],["توجيه المهام","Task routing","توجيه ذكي للمهام حسب التخصص","Intelligent routing by specialization"],["مزامنة السياق","Context sync","ذاكرة مشتركة عبر كل الوكلاء","Shared memory across all agents"]],
  intelligence:[["تحليل تنبؤي","Predictive analysis","توقع الأعطال والاختناقات قبل حدوثها","Predict failures and bottlenecks early"],["كشف الشذوذ","Anomaly detection","رصد آلي للأنماط غير الطبيعية","Automatic detection of abnormal patterns"],["استخبارات السوق","Market intel","تحليل المنافسين وفرص النمو","Competitor and growth-opportunity analysis"]],
  risk:[["تحليل التهديدات","Threat analysis","تقييم مستمر لسطح الهجوم","Continuous attack-surface assessment"],["تصليب البنية","Hardening","توصيات أمنية تلقائية","Automated security recommendations"],["استمرارية الأعمال","Continuity","جاهزية التعافي من الكوارث","Disaster-recovery readiness"]],
  orchestration:[["تدفقات ذاتية","Autonomous pipelines","تشغيل التدفقات عند وقوع الأحداث","Event-driven workflow execution"],["توجيه الأدوات","Tool routing","اختيار الأداة المثلى لكل مهمة","Optimal tool selection per task"],["خفض الكلفة","Cost optimization","موازنة الجودة مقابل الكلفة","Balance quality against inference cost"]]
};
function moduleView(route){
  const m=META[route]; const feats=MODFEAT[route]||[
    ["جاهز للإنتاج","Production-ready","معماري قابل للتوسع لملايين المستخدمين","Scalable architecture for millions of users"],
    ["أمن واستمرارية","Secure & resilient","مبادئ الثقة الصفرية والمراقبة الشاملة","Zero-trust principles and full observability"],
    ["أتمتة ذكية","Intelligent automation","تدفقات مؤتمتة موصولة بنبض المؤسسة","Automated flows wired to the enterprise pulse"]
  ];
  return whyStrip(
    L(`وحدة «${m.ar}» جزء من منظومة Nexus الموحّدة وتشارك نفس نبض المؤسسة.`,`The ${m.en} module is part of the unified Nexus fabric and shares the same enterprise pulse.`),
    L("متصلة بطبقة الذاكرة والسياق — لا أرقام متناقضة بين الشاشات.","Wired to the memory & context layer — no contradictory numbers across screens."),
    L("افتح آريا للحصول على إحاطة لحظية حول هذه الوحدة.","Open ARIA for a live briefing on this module.")
  )+
  `<div class="panel fade"><div class="modpanel">
    <div class="big">${ic(ICON[m.icon])}</div>
    <h2>${L(m.ar,m.en)}</h2>
    <p>${L("هذه الوحدة في النسخة الأصلية الكاملة موصولة بقاعدة بيانات Supabase وخوادم TanStack وبوابة الذكاء. في نسخة العرض المستقلة هذه (HTML واحد) تعرض الوحدة هويتها وقدراتها ضمن مركز القيادة.","In the full original build this module is wired to Supabase, TanStack server functions and the AI gateway. In this standalone single-file demo it presents its identity and capabilities inside the command center.")}</p>
    <div class="modfeatures">${feats.map(f=>`<div class="mf"><b>${L(f[0],f[1])}</b><small>${L(f[2],f[3])}</small></div>`).join("")}</div>
  </div></div>`;
}

function render(){
  document.getElementById("pageTitle").textContent=L(META[CURRENT].ar,META[CURRENT].en);
  const v=document.getElementById("view");
  v.innerHTML=CURRENT==="dashboard"?dashboardView():moduleView(CURRENT);
  if(CURRENT==="dashboard")renderDashboardWidgets();
  v.scrollTop=0;
}
function go(route){CURRENT=route;renderNav();render();}

/* =================== ARIA copilot (rule-based) =================== */
const ARIA_SUGGEST_AR=["اشرح مؤشر الجاهزية","صِغ إحاطة تنفيذية","ما أبرز المخاطر؟","أوصِ بإجراءات"];
const ARIA_SUGGEST_EN=["Explain the uptime KPI","Draft a briefing","Top risks?","Recommend actions"];
function ariaReply(q){
  q=q.toLowerCase();
  const hit=(...k)=>k.some(x=>q.includes(x));
  if(hit("جاهز","uptime","كفاءة"))return L("<b>الجاهزية 99.98%</b> محسوبة من نبض المؤسسة عبر 6 مناطق. الانقطاع الوحيد كان 4 دقائق بسبب تدوير عقدة — وتمت معالجته آليًا. الاتجاه صاعد +0.04% هذا الأسبوع.","<b>Uptime is 99.98%</b>, computed from the enterprise pulse across 6 regions. The only blip was a 4-minute node rotation, auto-remediated. Trend is +0.04% this week.");
  if(hit("إحاطة","briefing","brief"))return L("<b>الإحاطة التنفيذية:</b> 38 وكيلاً نشطاً، 1,284 أتمتة، 317 قراراً مدعوماً اليوم. الإيراد المتكرر +12% شهرياً. خطر واحد متوسط في الإمداد قيد المعالجة. لا حاجة لتدخل بشري عاجل.","<b>Executive briefing:</b> 38 active agents, 1,284 automations, 317 AI-assisted decisions today. Recurring revenue +12% MoM. One medium supply-chain risk being handled. No urgent human action required.");
  if(hit("مخاطر","risk","خطر"))return L("<b>أبرز المخاطر:</b> 1) زمن استجابة في عقدة الإمداد (متوسط). 2) سعة قاعدة البيانات تقترب من 78%. 3) شهادة TLS لأحد التكاملات تنتهي خلال 9 أيام. أوصي بمعالجة الأولى قبل 14:00.","<b>Top risks:</b> 1) Supply-node latency (medium). 2) DB capacity nearing 78%. 3) A TLS cert expires in 9 days. I recommend handling #1 before 14:00.");
  if(hit("أوص","recommend","إجراء","action"))return L("<b>توصياتي:</b> فعّل التوسع الاستباقي لعقدة الإمداد، رحّل 12% من الأحمال إلى المنطقة الثانية، وجدول تجديد شهادات TLS آلياً. أستطيع تنفيذ الثلاثة عبر التدفقات الذاتية بنقرة موافقة.","<b>Recommendations:</b> enable proactive autoscaling on the supply node, shift 12% of load to region 2, and schedule automatic TLS renewal. I can run all three via autonomous pipelines on your approval.");
  return L("أنا آريا، مساعد القيادة. أقرأ نبض المؤسسة لحظياً وأستطيع شرح المؤشرات، صياغة الإحاطات، تحليل المخاطر، والتوصية بإجراءات. هذه نسخة عرض بقواعد محلية — في النظام الكامل أتصل ببوابة الذكاء والخوادم.","I'm ARIA, your executive copilot. I read the live enterprise pulse and can explain KPIs, draft briefings, analyze risk, and recommend actions. This is a local rule-based demo — in the full system I connect to the AI gateway and server functions.");
}
function ariaPush(text,who){const b=document.getElementById("ariaBody");const d=document.createElement("div");d.className="msg "+who;d.innerHTML=text;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function ariaSend(q){if(!q.trim())return;ariaPush(q,"user");setTimeout(()=>ariaPush(ariaReply(q),"bot"),350);}
function renderAriaSuggest(){document.getElementById("ariaSuggest").innerHTML=(LOCALE==="ar"?ARIA_SUGGEST_AR:ARIA_SUGGEST_EN).map(s=>`<button>${s}</button>`).join("");
  document.querySelectorAll("#ariaSuggest button").forEach(b=>b.onclick=()=>ariaSend(b.textContent));}
function openAria(){document.getElementById("ariaDrawer").classList.add("open");document.getElementById("scrim").classList.add("show");}
function closeAria(){document.getElementById("ariaDrawer").classList.remove("open");document.getElementById("scrim").classList.remove("show");}

/* =================== command palette =================== */
function openCmd(){document.getElementById("cmdk").classList.add("show");const i=document.getElementById("cmdInput");i.value="";renderCmd("");i.focus();}
function closeCmd(){document.getElementById("cmdk").classList.remove("show");}
let cmdSel=0,cmdItems=[];
function renderCmd(q){
  cmdItems=[];NAV.forEach(g=>g.items.forEach(it=>{const lab=L(it[1],it[2]);if(lab.toLowerCase().includes(q.toLowerCase())||it[0].includes(q.toLowerCase()))cmdItems.push({r:it[0],lab,g:T().groups[g.g],icon:it[3]});}));
  cmdSel=0;
  document.getElementById("cmdList").innerHTML=cmdItems.map((c,i)=>`<div class="cmdk-item ${i===0?'sel':''}" data-r="${c.r}">${ic(ICON[c.icon])}<span>${c.lab}</span><span class="grp">${c.g}</span></div>`).join("")||`<div style="padding:14px;color:var(--muted-fg);font-size:13px">${L("لا نتائج","No results")}</div>`;
  document.querySelectorAll(".cmdk-item").forEach(el=>el.onclick=()=>{go(el.dataset.r);closeCmd();});
}

/* =================== theme + locale =================== */
function applyLocale(){
  document.documentElement.lang=LOCALE;document.documentElement.dir=LOCALE==="ar"?"rtl":"ltr";
  document.documentElement.dataset.locale=LOCALE;
  document.getElementById("brandSub").textContent=T().brandSub;
  document.getElementById("livePill").textContent=T().live;
  document.getElementById("cmdLabel").textContent=T().cmd;
  document.getElementById("ariaLabel").textContent=T().aria;
  document.getElementById("ariaRole").textContent=T().ariaRole;
  document.getElementById("ariaInput").placeholder=T().ariaPlaceholder;
  document.getElementById("cmdInput").placeholder=T().cmdPlaceholder;
  document.getElementById("langBtn").textContent=LOCALE==="ar"?"EN":"ع";
  renderNav();render();renderAriaSuggest();
}
function applyTheme(){document.documentElement.dataset.theme=THEME;
  document.getElementById("themeIcon").innerHTML=THEME==="dark"
    ?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>'
    :'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  if(CURRENT==="dashboard")renderDashboardWidgets();}

/* =================== events =================== */
document.getElementById("ariaBtn").onclick=openAria;
document.getElementById("ariaClose").onclick=closeAria;
document.getElementById("scrim").onclick=closeAria;
document.getElementById("ariaSend").onclick=()=>{const i=document.getElementById("ariaInput");ariaSend(i.value);i.value="";};
document.getElementById("ariaInput").addEventListener("keydown",e=>{if(e.key==="Enter"){ariaSend(e.target.value);e.target.value="";}});
document.getElementById("cmdBtn").onclick=openCmd;
document.getElementById("cmdInput").addEventListener("input",e=>renderCmd(e.target.value));
document.getElementById("cmdInput").addEventListener("keydown",e=>{
  const items=document.querySelectorAll(".cmdk-item");if(!items.length)return;
  if(e.key==="ArrowDown"){cmdSel=(cmdSel+1)%items.length;}else if(e.key==="ArrowUp"){cmdSel=(cmdSel-1+items.length)%items.length;}
  else if(e.key==="Enter"){if(cmdItems[cmdSel]){go(cmdItems[cmdSel].r);closeCmd();}return;}else return;
  items.forEach((el,i)=>el.classList.toggle("sel",i===cmdSel));e.preventDefault();});
document.getElementById("langBtn").onclick=()=>{LOCALE=LOCALE==="ar"?"en":"ar";applyLocale();};
document.getElementById("themeBtn").onclick=()=>{THEME=THEME==="dark"?"light":"dark";applyTheme();};
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd();}
  if(e.key==="Escape"){closeCmd();closeAria();}
});
window.addEventListener("resize",()=>{if(CURRENT==="dashboard")renderDashboardWidgets();});

/* live clock */
function tick(){const d=new Date();const opt={hour:"2-digit",minute:"2-digit",second:"2-digit"};
  document.getElementById("clock").textContent=d.toLocaleTimeString(LOCALE==="ar"?"ar-SA":"en-US",opt);}
setInterval(tick,1000);tick();

/* live pulse mutation — numbers stay coherent across screens */
setInterval(()=>{
  PULSE.throughput.push(Math.max(400,PULSE.throughput.at(-1)+(rnd()-0.45)*80));PULSE.throughput.shift();
  if(CURRENT==="dashboard"){const t=document.getElementById("cThroughput");if(t)lineChart(t,PULSE.throughput,"oklch(0.62 0.17 235)",true);}
},2500);

/* boot */
applyTheme();applyLocale();
ariaPush(L("مرحباً، أنا <b>آريا</b> — مساعد القيادة التنفيذي. أقرأ نبض المؤسسة لحظياً. كيف أخدمك؟","Hello, I'm <b>ARIA</b> — your executive copilot. I read the enterprise pulse in real time. How can I help?"),"bot");
</script>
</body>
</html>
