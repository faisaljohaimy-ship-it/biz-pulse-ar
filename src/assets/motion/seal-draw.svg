<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" class="nx-seal">
  <title>ختم الامتثال — مُعتمد</title>
  <!--
    ختم الاعتماد — الأصل الوحيد المؤلَّف بهندسة مطبَّعة.

    لماذا أصلٌ مؤلَّف وباقي الحركات على أيقونات lucide في مكانها: `pathLength`
    سمةٌ في الترميز لا خاصيةٌ في CSS، فلا سبيل لطبقة أنماط أن تُطبِّع أطوال
    مسارات لم تُكتب لها. وبتطبيعها هنا إلى ١ يقود إطارٌ واحد (`1 → 0`) كل
    مسار مهما اختلف طوله الحقيقي — الدرع ٥٨٫٧ وحدة والعلامة ٨٫٥، ويرسمان
    بنفس السرعة المقروءة بلا جدول أطوال.

    الهندسة من `lucide-react@1.21.0` (رخصة ISC، والحزمة مشحونة أصلًا) — كي
    يبقى الختم هو نفسه رمز `ShieldCheck` في بقيّة النظام لا شكلًا ثانيًا.

    `currentColor` لا لون: يرث لون الحاوية فينقلب مع الوضعين ويتلوّن بلون
    المنطقة. وهذا يشترط **تضمين** الملف في الترميز (inline). المحمَّل عبر
    `<img>` يحلّ `currentColor` على مستنداته هو فيخرج أسود، ولا يبلغه مفتاح
    `data-nx-motion="off"`.
  -->
  <style>
    .nx-seal path { stroke-dasharray: 1; stroke-dashoffset: 1; }
    /* الدرع أوّلًا ثم العلامة — العلامة تعني «تحقّق»، ولا يتحقّق ما لم يُرسم بعد. */
    .nx-seal .s { animation: nx-seal-draw 560ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .nx-seal .c { animation: nx-seal-draw 320ms cubic-bezier(0.16, 1, 0.3, 1) 480ms forwards; }
    @keyframes nx-seal-draw { to { stroke-dashoffset: 0; } }
    /* السكون يعرض الختم مكتملًا — لا نصفَ ختم، فنصفه رمزٌ آخر. */
    @media (prefers-reduced-motion: reduce) {
      .nx-seal path { stroke-dashoffset: 0; animation: none; }
    }
  </style>
  <path class="s" pathLength="1" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
  <path class="c" pathLength="1" d="m9 12 2 2 4-4"/>
</svg>
